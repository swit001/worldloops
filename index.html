<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorldLoops</title>
    <meta name="description" content="The executable world layer for agents." />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f2;
        color: #1e2549;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 72px;
        box-sizing: border-box;
        max-width: 880px;
      }
      h1 {
        font-size: 56px;
        line-height: 1;
        margin: 0 0 20px;
        letter-spacing: -0.04em;
      }
      .tagline {
        font-size: 24px;
        line-height: 1.4;
        margin: 0 0 24px;
        font-weight: 600;
      }
      p {
        font-size: 18px;
        line-height: 1.7;
        margin: 0;
        color: #33384f;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
        flex-wrap: wrap;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        border: 1px solid #1e2549;
        color: #1e2549;
        text-decoration: none;
        font-weight: 650;
      }
      a.primary {
        background: #1e2549;
        color: #f7f7f2;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WorldLoops</h1>
      <div class="tagline">The executable world layer for agents.</div>
      <p>
        WorldLoops observes scattered signals, normalizes them into entities,
        proposes governed transitions, and helps close open loops across apps.
      </p>
      <div class="actions">
        <a class="primary" href="https://github.com/swit001/worldloops">View on GitHub</a>
        <a href="https://github.com/swit001/worldloops#readme">Read the README</a>
      </div>
    </main>
  </body>
</html>
